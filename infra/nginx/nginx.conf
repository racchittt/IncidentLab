log_format incidentlab_json escape=json '{'
    '"request_id":"$request_id",'
    '"status":$status,'
    '"uri":"$uri",'
    '"request_time":$request_time,'
    '"upstream_response_time":"$upstream_response_time"'
'}';

server {
    listen 80;
    # NOT /var/log/nginx/access.log - the nginx:alpine image symlinks that path
    # to /dev/stdout (so `docker logs` captures it), which isn't a real file
    # Alloy's file tailer can follow. This path is a genuine file in the
    # nginx_logs volume instead.
    access_log /var/log/nginx/access.json.log incidentlab_json;

    # Docker's embedded DNS (127.0.0.11) re-resolves service hostnames as
    # containers are recreated. A plain `proxy_pass http://order-service:3001`
    # resolves once at config load and caches that IP for nginx's whole
    # lifetime - stale the moment order-service is rebuilt while nginx keeps
    # running. Using a variable forces proxy_pass to re-resolve per this TTL.
    resolver 127.0.0.11 valid=10s;
    set $order_service http://order-service:3001;

    location /orders {
        # nginx's own default for a rejected request is 503 - indistinguishable
        # from an upstream failure in the access log. 429 makes "the gateway
        # rate-limited this" legible on its own.
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass $order_service;
        # Links this access log line to order-service's own trace/logs.
        proxy_set_header X-Request-Id $request_id;
    }
}
