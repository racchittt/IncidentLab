services:
  floci:
    image: floci/floci
    ports:
      - "4566:4566"
    environment:
      - SERVICES=dynamodb,sqs

  order-service:
    build: ./services/order-service
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
