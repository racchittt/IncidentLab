services:
  floci:
    image: floci/floci
    ports:
      - "4566:4566"
    environment:
      - SERVICES=dynamodb,sqs
    profiles: ["sim"]

  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    profiles: ["sim"]
    restart: unless-stopped
    depends_on:
      floci:
        condition: service_healthy
    environment:
      - OTEL_SERVICE_NAME=order-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-lgtm:4318
      - AWS_ENDPOINT_URL=http://floci:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test

  worker-service:
    build:
      context: .
      dockerfile: services/worker-service/Dockerfile
    profiles: ["sim"]
    restart: unless-stopped
    depends_on:
      floci:
        condition: service_healthy
    environment:
      - OTEL_SERVICE_NAME=worker-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-lgtm:4318
      - AWS_ENDPOINT_URL=http://floci:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    profiles: ["sim"]
    depends_on:
      - order-service

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=incidentlab
      - POSTGRES_PASSWORD=incidentlab
      - POSTGRES_DB=incidentlab
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incidentlab"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    profiles: ["sim"]

  mock-payment-provider:
    build:
      context: .
      dockerfile: services/mock-payment-provider/Dockerfile
    profiles: ["sim"]
    restart: unless-stopped
    environment:
      - OTEL_SERVICE_NAME=mock-payment-provider
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-lgtm:4318
      - LATENCY_MS=0
      - ERROR_RATE=0

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    profiles: ["sim"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - OTEL_SERVICE_NAME=payment-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-lgtm:4318
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=incidentlab
      - PGPASSWORD=incidentlab
      - PGDATABASE=incidentlab

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - ./infra/toxiproxy/toxiproxy.json:/config/toxiproxy.json
    profiles: ["sim"]
    depends_on:
      - mock-payment-provider

  k6:
    image: grafana/k6
    command: ["run", "/scripts/orders.js"]
    volumes:
      - ./infra/loadgen/orders.js:/scripts/orders.js
    profiles: ["sim"]
    depends_on:
      - nginx

  otel-lgtm:
    image: grafana/otel-lgtm
    profiles: ["obs"]
    ports: ["3000:3000", "4317:4317", "4318:4318"]
