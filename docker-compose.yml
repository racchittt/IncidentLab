services:
  floci:
    image: floci/floci
    ports:
      - "4566:4566"
    environment:
      - SERVICES=dynamodb,sqs
    profiles: ["sim"]

  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    profiles: ["sim"]
    restart: unless-stopped
    depends_on:
      floci:
        condition: service_healthy
    environment:
      - OTEL_SERVICE_NAME=order-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-lgtm:4318
      - AWS_ENDPOINT_URL=http://floci:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test

  worker-service:
    build:
      context: .
      dockerfile: services/worker-service/Dockerfile
    profiles: ["sim"]
    restart: unless-stopped
    depends_on:
      floci:
        condition: service_healthy
    environment:
      - OTEL_SERVICE_NAME=worker-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-lgtm:4318
      - AWS_ENDPOINT_URL=http://floci:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - WORKER_CONCURRENCY=5

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./infra/nginx/ratelimit.conf:/etc/nginx/conf.d/ratelimit.conf
      - nginx_logs:/var/log/nginx
    profiles: ["sim"]
    depends_on:
      - order-service

  alloy:
    image: grafana/alloy:latest
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/config.alloy"]
    volumes:
      - ./infra/alloy/config.alloy:/etc/alloy/config.alloy
      - nginx_logs:/var/log/nginx:ro
    profiles: ["sim"]
    depends_on:
      - nginx

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=incidentlab
      - POSTGRES_PASSWORD=incidentlab
      - POSTGRES_DB=incidentlab
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incidentlab"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    profiles: ["sim"]

  mock-payment-provider:
    build:
      context: .
      dockerfile: services/mock-payment-provider/Dockerfile
    profiles: ["sim"]
    restart: unless-stopped
    ports: ["3002:3002"]
    environment:
      - OTEL_SERVICE_NAME=mock-payment-provider
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-lgtm:4318
      - LATENCY_MS=0
      - ERROR_RATE=0
      # max rapid (same-idempotency-key, <15ms apart) retries tolerated before
      # the provider starts adding latency/rejecting - see mock-payment-provider
      # for why this is keyed on retry timing rather than raw concurrency.
      - CAPACITY=3

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    profiles: ["sim"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      toxiproxy:
        condition: service_started
    environment:
      - OTEL_SERVICE_NAME=payment-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-lgtm:4318
      # routed through toxiproxy so INC-12 can simulate a real DB outage
      # (proxy.toggle) without touching payment-service's own config.
      - PGHOST=toxiproxy
      - PGPORT=5433
      - PGUSER=incidentlab
      - PGPASSWORD=incidentlab
      - PGDATABASE=incidentlab

  deploy-registry:
    build:
      context: .
      dockerfile: services/deploy-registry/Dockerfile
    profiles: ["sim"]
    restart: unless-stopped
    ports: ["3004:3004"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - OTEL_SERVICE_NAME=deploy-registry
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-lgtm:4318
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=incidentlab
      - PGPASSWORD=incidentlab
      - PGDATABASE=registry

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    ports: ["8474:8474"]
    volumes:
      - ./infra/toxiproxy/toxiproxy.json:/config/toxiproxy.json
    profiles: ["sim"]
    depends_on:
      - mock-payment-provider

  loadgen:
    build:
      context: .
      dockerfile: services/loadgen/Dockerfile
    profiles: ["sim"]
    restart: unless-stopped
    ports: ["3005:3005"]
    depends_on:
      - nginx
    environment:
      - OTEL_SERVICE_NAME=loadgen
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-lgtm:4318
      - RPS=5

  sqs-exporter:
    build:
      context: .
      dockerfile: services/sqs-exporter/Dockerfile
    profiles: ["sim"]
    restart: unless-stopped
    depends_on:
      floci:
        condition: service_healthy
    environment:
      - OTEL_SERVICE_NAME=sqs-exporter
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-lgtm:4318
      - AWS_ENDPOINT_URL=http://floci:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test

  otel-lgtm:
    image: grafana/otel-lgtm
    profiles: ["obs"]
    ports: ["3000:3000", "4317:4317", "4318:4318", "9090:9090", "3100:3100", "3200:3200"]

volumes:
  nginx_logs:
